# OpenPERouter FRR Configuration Template — EVPN Client (ISIS + SRv6)
# Copied by generate-config.sh
#
# Peering model:
#   - TOR (direct):     ipv4 vpn + ipv6 vpn  (SRv6 routes only)
#   - EVPN-CLIENTS:     l2vpn evpn only (reflected)

underlays:
  - asn: 65500
    tunnelEndpoint:
      cidrs:
        - 100.65.0.0/24
        - fd00::/64
    interfaces:
    - type: NetworkDevice
      networkDevice:
        interfaceName: enp2s0
    routerIDCIDR: 10.0.0.0/24
    isis:
      baseNet: "49.0001.0000.0000.0000.00"
      level: 1
    srv6:
      encapBehavior: "H.Encaps.Red"
      locator:
        basePrefix: "fd00:1234::/48"
        format: "usid-f3216"
    nodeSelector:
      matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: DoesNotExist
    neighbors:
      - type: Internal
        address: fc00:0:20::1
      - type: Internal
        address: fd00::2
      - type: Internal
        address: fd00::3
      - type: Internal
        address: fd00::4
l2vnis:
  - vni: 210
    routingDomain:
      type: L3VPN
      l3vpn:
        name: red
    vxlanport: 4789
    gatewayIPs:
      - "192.168.110.1/24"
      - "fd00:110::1/64"
    hostMaster:
      type: LinuxBridge
      linuxBridge:
        lifecycle: External
        name: br0
l3vpns:
  - name: red
    vrf: red
    rdAssignedNumber: 2
    exportRTs:
    - "65500:2"
    importRTs:
    - "65500:2"
